name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer || true
      - name: Install tools
        run: brew install xcodegen xcode-build-server swiftlint
      - name: Lint
        run: swiftlint lint --quiet --strict
      - name: Test packages and build apps
        run: ./scripts/test.sh
