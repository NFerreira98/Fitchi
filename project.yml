# XcodeGen spec — the single source of truth for the Xcode project.
# Fitchi.xcodeproj is generated from this file and is NOT committed.
# Regenerate after adding/removing files or changing settings:  ./scripts/bootstrap.sh
name: Fitchi

options:
  bundleIdPrefix: com.nicholasferreira
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  FitchiCore:
    path: Packages/FitchiCore
  FitchiData:
    path: Packages/FitchiData
  FitchiHealth:
    path: Packages/FitchiHealth
  FitchiUI:
    path: Packages/FitchiUI

targets:
  # ---------------------------------------------------------------- iPhone companion
  FitchiPhone:
    type: application
    platform: iOS
    sources:
      - Apps/Phone
      - Apps/Shared # code both apps compile (widget data, care reminders)
      - path: Content # bundled catalog JSON: the phone shows the backed-up pet
        type: folder
        buildPhase: resources
    entitlements:
      path: Apps/Phone/Fitchi.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.nicholasferreira.fitchi]
    settings:
      base:
        PRODUCT_NAME: Fitchi
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasferreira.fitchi
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fitchi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: Fitchi reads your workouts and exercise minutes to earn Pep for your pet.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Fitchi saves workouts you start in the app to Apple Health.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: FitchiWatch # embedded under Fitchi.app/Watch
      - target: FitchiPhoneWidgets # Home and Lock Screen widgets
      - package: FitchiCore
      - package: FitchiData
      - package: FitchiHealth
      - package: FitchiUI

  # ---------------------------------------------------------------- Apple Watch app
  FitchiWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/Watch
      - Apps/Shared
      - path: Content # bundled catalog JSON, loaded by PetStore
        type: folder
        buildPhase: resources
    entitlements:
      path: Apps/Watch/FitchiWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.com.nicholasferreira.fitchi]
    settings:
      base:
        PRODUCT_NAME: Fitchi
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasferreira.fitchi.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fitchi
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.nicholasferreira.fitchi
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Fitchi reads your workouts and exercise minutes to earn Pep for your pet.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Fitchi saves workouts you start in the app to Apple Health.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: FitchiWatchWidgets
      - package: FitchiCore
      - package: FitchiData
      - package: FitchiHealth
      - package: FitchiUI

  # ---------------------------------------------------------------- Watch complications
  FitchiWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/Widgets
        excludes: [Info.plist, PhoneInfo.plist, "*.entitlements"]
    entitlements:
      path: Apps/Widgets/FitchiWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholasferreira.fitchi]
    info:
      path: Apps/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Fitchi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: FitchiWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasferreira.fitchi.watchkitapp.widgets
        SKIP_INSTALL: YES
    dependencies:
      - package: FitchiCore
      - package: FitchiData
      - package: FitchiUI

  # ---------------------------------------------------------------- iPhone widgets
  # Same code as the complications (Apps/Widgets), plus Home Screen sizes.
  FitchiPhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Widgets
        excludes: [Info.plist, PhoneInfo.plist, "*.entitlements"]
    entitlements:
      path: Apps/Widgets/FitchiPhoneWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholasferreira.fitchi]
    info:
      path: Apps/Widgets/PhoneInfo.plist
      properties:
        CFBundleDisplayName: Fitchi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: FitchiPhoneWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasferreira.fitchi.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - package: FitchiCore
      - package: FitchiData
      - package: FitchiUI

schemes:
  FitchiPhone:
    build:
      targets:
        FitchiPhone: all
    run:
      config: Debug
    archive:
      config: Release
  FitchiWatch:
    build:
      targets:
        FitchiWatch: all
    run:
      config: Debug
    archive:
      config: Release
