included:
  - Apps
  - Packages
excluded:
  - .build
  - Packages/*/.build
disabled_rules:
  - trailing_comma        # swift-format owns formatting
  - opening_brace
opt_in_rules:
  - empty_count
  - first_where
  - fatal_error_message
  - force_unwrapping
line_length:
  warning: 140
  error: 180
function_parameter_count:
  warning: 7
  error: 8
identifier_name:
  excluded: [id, x, y, s, m, l, xs, v1, v2, v3]
analyzer_rules:
  - unused_import
